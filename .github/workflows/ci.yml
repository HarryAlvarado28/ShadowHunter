name: ShadowHunter CI

on:
  push:
    branches: [main, cooking]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check shell script syntax
        run: bash -n install.sh uninstall.sh build.sh
      - name: Compile Python modules
        run: python -m compileall -q shadowhunterkit
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test command interface
        run: |
          python -m shadowhunterkit --version
          python -m shadowhunterkit modules
          python -m shadowhunterkit doctor
          python -m shadowhunterkit run system.info
