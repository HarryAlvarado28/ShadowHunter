name: CI

on:
  push:
    branches: [main, cooking]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Check & build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Lint
        run: |
          python -m pip install --disable-pip-version-check ruff
          ruff check shadowhunterkit tests
          shellcheck install.sh uninstall.sh build.sh
          test -z "$(gofmt -l cmd/evidencehash/*.go)"
          go vet ./...
      - name: Test
        run: |
          python -m unittest discover -s tests -q
          go test ./...
      - name: Smoke test
        run: |
          python -m shadowhunterkit --version
          python -m shadowhunterkit modules
          python -m shadowhunterkit run system.info
      - name: Build Linux
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "dist/linux_$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath -ldflags="-s -w" \
              -o "dist/linux_$arch/shadowhunter-worker" ./cmd/evidencehash
            tar -czf "dist/shadowhunter-linux-$arch.tar.gz" \
              install.sh uninstall.sh shadowhunterkit README.md SECURITY.md \
              "dist/linux_$arch/shadowhunter-worker"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: shadowhunter-linux
          path: dist/shadowhunter-linux-*.tar.gz
          retention-days: 14
