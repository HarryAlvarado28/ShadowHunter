[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowhunter-workbench"
version = "0.2.0"
description = "Dependency-free, terminal-first workbench for authorized security assessments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["security", "osint", "linux", "terminal", "workbench"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]
dependencies = []

[project.scripts]
shadowhunter = "shadowhunterkit.cli:main"
shunter = "shadowhunterkit.cli:main"

[tool.setuptools.packages.find]
include = ["shadowhunterkit*"]
